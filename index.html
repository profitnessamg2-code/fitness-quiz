<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка клуба</title>
<style>
  :root {
    --bg: #f3f5f2;
    --card: #ffffff;
    --ink: #1c2420;
    --muted: #66726b;
    --line: #dfe5e0;
    --accent: #1f6b4f;
    --accent-ink: #ffffff;
    --danger: #b3382c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a17;
      --card: #1d2420;
      --ink: #e8eee9;
      --muted: #94a39a;
      --line: #2c3731;
      --accent: #4fb98a;
      --accent-ink: #0d1a13;
      --danger: #e5766a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; padding: 11px 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 10px; font: inherit; cursor: pointer;
  }
  .tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .row > div { flex: 1 1 110px; }
  .btn {
    padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 400; }
  .btn.small { padding: 6px 10px; font-size: 14px; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); font-weight: 400; }
  .slot {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 0; border-top: 1px solid var(--line);
  }
  .muted { color: var(--muted); font-size: 14px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .head strong { font-size: 18px; }
  .price { font-weight: 700; font-size: 18px; white-space: nowrap; }
  .msg { min-height: 22px; margin: 8px 0; font-size: 14px; color: var(--muted); }
  .msg.err { color: var(--danger); }
  .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: 0 0 56px;
    background: var(--bg); border: 1px solid var(--line);
  }
  .avatar.ph { display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: var(--muted); }
  .who a { color: var(--accent); text-decoration: none; margin-right: 10px; }
  details.edit { margin: 4px 0 8px; }
  details.edit summary { cursor: pointer; color: var(--accent); font-size: 14px; padding: 6px 0; }
  details.edit[open] summary { margin-bottom: 8px; }
  .login { max-width: 360px; margin: 12vh auto 0; }
  .login .card > * + * { margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://yixwxsyxrtqrqkzxvskf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hbNcTliHSoJEb1nwWlSU1w_WTT2G1lf';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const DAYS_SHORT = ['пн','вт','ср','чт','пт','сб','вс'];

const state = { session: null, tab: 'trainers', trainers: [], memberships: [], msg: '', err: false };
const app = document.getElementById('app');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function say(text, err = false) { state.msg = text; state.err = err; render(); }
function money(n) { return Number(n).toLocaleString('ru-RU') + ' ₸'; }
function hhmm(t) { return String(t).slice(0, 5); }

async function init() {
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if (state.session) await loadAll();
  render();
}

async function loadAll() {
  const t = await sb.from('trainers').select('*, trainer_slots(*)').order('name');
  const m = await sb.from('memberships').select('*').order('price');
  if (t.error || m.error) { say('Не удалось загрузить данные: ' + (t.error || m.error).message, true); return; }
  state.trainers = t.data;
  state.memberships = m.data;
}

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { say('Неверная почта или пароль', true); return; }
  state.session = data.session;
  state.msg = '';
  await loadAll();
  render();
}

async function logout() {
  await sb.auth.signOut();
  state.session = null;
  render();
}

function setTab(t) { state.tab = t; state.msg = ''; render(); }

function val(id) { return document.getElementById(id).value.trim(); }

function cleanPhone(s) {
  let d = String(s || '').replace(/\D/g, '');
  if (d.length === 11 && d.startsWith('8')) d = '7' + d.slice(1);
  return d || null;
}
function cleanInsta(s) {
  let v = String(s || '').trim();
  if (!v) return null;
  v = v.replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/[/?#].*$/, '').replace(/^@/, '');
  return v || null;
}
function contactsHtml(t) {
  const out = [];
  if (t.whatsapp) out.push(`<a href="https://wa.me/${esc(t.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>`);
  if (t.instagram) out.push(`<a href="https://instagram.com/${esc(t.instagram)}" target="_blank" rel="noopener">@${esc(t.instagram)}</a>`);
  return out.length ? out.join('') : 'Контакты не указаны';
}

// уменьшаем фото до 700px и загружаем в хранилище
function resizeImage(file, max = 700) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('не удалось обработать фото')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('это не изображение')); };
    img.src = url;
  });
}
async function uploadPhoto(file) {
  const blob = await resizeImage(file);
  const path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
  const { error } = await sb.storage.from('trainer-photos').upload(path, blob, { contentType: 'image/jpeg' });
  if (error) throw error;
  return sb.storage.from('trainer-photos').getPublicUrl(path).data.publicUrl;
}

async function addTrainer() {
  const name = val('tname');
  if (!name) { say('Введите имя тренера', true); return; }
  const row = { name, whatsapp: cleanPhone(val('twa')), instagram: cleanInsta(val('tig')) };
  const file = document.getElementById('tphoto').files[0];
  if (file) {
    try { row.photo_url = await uploadPhoto(file); }
    catch (e) { say('Не удалось загрузить фото: ' + e.message, true); return; }
  }
  const { error } = await sb.from('trainers').insert(row);
  if (error) { say('Ошибка: ' + error.message, true); return; }
  await loadAll(); say('Тренер добавлен');
}

async function saveTrainerInfo(id) {
  const upd = { whatsapp: cleanPhone(val('wa' + id)), instagram: cleanInsta(val('ig' + id)) };
  const file = document.getElementById('photo' + id).files[0];
  if (file) {
    try { upd.photo_url = await uploadPhoto(file); }
    catch (e) { say('Не удалось загрузить фото: ' + e.message, true); return; }
  }
  const { error } = await sb.from('trainers').update(upd).eq('id', id);
  if (error) { say('Ошибка: ' + error.message, true); return; }
  await loadAll(); say('Данные тренера сохранены');
}

async function removePhoto(id) {
  const { error } = await sb.from('trainers').update({ photo_url: null }).eq('id', id);
  if (error) { say('Ошибка: ' + error.message, true); return; }
  await loadAll(); say('Фото убрано');
}

async function deleteTrainer(id) {
  if (!confirm('Удалить тренера вместе с его расписанием?')) return;
  const { error } = await sb.from('trainers').delete().eq('id', id);
  if (error) { say('Ошибка: ' + error.message, true); return; }
  await loadAll(); say('Тренер удалён');
}

async function addSlot(trainerId) {
  const day = Number(document.getElementById('day' + trainerId).value);
  const from = document.getElementById('from' + trainerId).value;
  const to = document.getElementById('to' + trainerId).value;
  if (!from || !to) { say('Укажите время «с» и «до»', true); return; }
  if (from >= to) { say('Время «до» должно быть позже времени «с»', true); return; }
  const { error } = await sb.from('trainer_slots').insert({ trainer_id: trainerId, day, time_from: from, time_to: to });
  if (error) { say('Ошибка: ' + error.message, true); return; }
  await loadAll(); say('Время добавлено');
}

async function deleteSlot(id) {
  const { error } = await sb.from('trainer_slots').delete().eq('id', id);
  if (error) { say('Ошибка: ' + error.message, true); return; }
  await loadAll(); say('Время удалено');
}

async function addMembership() {
  const name = document.getElementById('mname').value.trim();
  const price = parseInt(document.getElementById('mprice').value, 10);
  const vpw = document.getElementById('mvisits').value;
  const description = document.getElementById('mdesc').value.trim();
  if (!name) { say('Введите название абонемента', true); return; }
  if (!price || price < 0) { say('Укажите цену', true); return; }
  const { error } = await sb.from('memberships').insert({
    name, price, description: description || null, visits_per_week: vpw ? parseInt(vpw, 10) : null
  });
  if (error) { say('Ошибка: ' + error.message, true); return; }
  await loadAll(); say('Абонемент добавлен');
}

async function editPrice(id, current) {
  const v = prompt('Новая цена, ₸', current);
  if (v === null) return;
  const price = parseInt(v, 10);
  if (!price || price < 0) { say('Некорректная цена', true); return; }
  const { error } = await sb.from('memberships').update({ price }).eq('id', id);
  if (error) { say('Ошибка: ' + error.message, true); return; }
  await loadAll(); say('Цена обновлена');
}

async function deleteMembership(id) {
  if (!confirm('Удалить абонемент?')) return;
  const { error } = await sb.from('memberships').delete().eq('id', id);
  if (error) { say('Ошибка: ' + error.message, true); return; }
  await loadAll(); say('Абонемент удалён');
}

function renderLogin() {
  app.innerHTML = `
    <div class="login">
      <div class="card">
        <h1>Вход в админку</h1>
        <div><label for="email">Почта</label><input id="email" type="email" autocomplete="username"></div>
        <div><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password"></div>
        <button class="btn" onclick="login()">Войти</button>
        <div class="msg ${state.err ? 'err' : ''}">${esc(state.msg)}</div>
      </div>
    </div>`;
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
}

function renderTrainers() {
  const dayOptions = DAYS.map((d, i) => `<option value="${i}">${d}</option>`).join('');
  const list = state.trainers.map(t => {
    const slots = [...(t.trainer_slots || [])].sort((a, b) => a.day - b.day || a.time_from.localeCompare(b.time_from));
    const slotsHtml = slots.length
      ? slots.map(s => `
          <div class="slot">
            <span>${DAYS_SHORT[s.day]}, ${hhmm(s.time_from)}–${hhmm(s.time_to)}</span>
            <button class="btn danger small" onclick="deleteSlot(${s.id})">Убрать</button>
          </div>`).join('')
      : '<div class="slot muted">Расписание пока пустое</div>';
    return `
      <div class="card">
        <div class="head">
          <div class="who">
            ${t.photo_url
              ? `<img class="avatar" src="${esc(t.photo_url)}" alt="">`
              : `<div class="avatar ph">${esc(t.name.slice(0, 1).toUpperCase())}</div>`}
            <div>
              <strong>${esc(t.name)}</strong>
              <div class="muted">${contactsHtml(t)}</div>
            </div>
          </div>
          <button class="btn danger small" onclick="deleteTrainer(${t.id})">Удалить</button>
        </div>
        <details class="edit">
          <summary>Фото и контакты</summary>
          <div class="row">
            <div><label for="wa${t.id}">WhatsApp</label><input id="wa${t.id}" type="tel" value="${esc(t.whatsapp || '')}" placeholder="+7 777 123 45 67"></div>
            <div><label for="ig${t.id}">Instagram</label><input id="ig${t.id}" value="${esc(t.instagram || '')}" placeholder="@username"></div>
          </div>
          <div style="margin-top:10px"><label for="photo${t.id}">Новое фото</label><input id="photo${t.id}" type="file" accept="image/*"></div>
          <div class="row" style="margin-top:10px">
            <div style="flex:0 0 auto"><button class="btn" onclick="saveTrainerInfo(${t.id})">Сохранить</button></div>
            ${t.photo_url ? `<div style="flex:0 0 auto"><button class="btn danger small" onclick="removePhoto(${t.id})">Убрать фото</button></div>` : ''}
          </div>
        </details>
        ${slotsHtml}
        <div class="row" style="margin-top:12px">
          <div><label for="day${t.id}">День</label><select id="day${t.id}">${dayOptions}</select></div>
          <div><label for="from${t.id}">С</label><input id="from${t.id}" type="time" value="09:00"></div>
          <div><label for="to${t.id}">До</label><input id="to${t.id}" type="time" value="12:00"></div>
          <div style="flex:0 0 auto"><button class="btn" onclick="addSlot(${t.id})">Добавить время</button></div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="card">
      <h2>Новый тренер</h2>
      <div class="row">
        <div style="flex:2 1 180px"><label for="tname">Имя</label><input id="tname" placeholder="Например, Дмитрий"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div><label for="twa">WhatsApp</label><input id="twa" type="tel" placeholder="+7 777 123 45 67"></div>
        <div><label for="tig">Instagram</label><input id="tig" placeholder="@username"></div>
      </div>
      <div style="margin-top:10px"><label for="tphoto">Фото (необязательно)</label><input id="tphoto" type="file" accept="image/*"></div>
      <div style="margin-top:12px"><button class="btn" onclick="addTrainer()">Добавить тренера</button></div>
    </div>
    ${list || '<p class="muted">Тренеров пока нет. Добавьте первого.</p>'}`;
}

function renderMemberships() {
  const list = state.memberships.map(m => `
    <div class="card">
      <div class="head">
        <strong>${esc(m.name)}</strong>
        <span class="price">${money(m.price)}</span>
      </div>
      <div class="muted">${m.visits_per_week ? m.visits_per_week + ' раз(а) в неделю' : 'Без ограничения по посещениям'}</div>
      ${m.description ? `<div style="margin-top:6px">${esc(m.description)}</div>` : ''}
      <div class="row" style="margin-top:12px">
        <div style="flex:0 0 auto"><button class="btn ghost small" onclick="editPrice(${m.id}, ${m.price})">Изменить цену</button></div>
        <div style="flex:0 0 auto"><button class="btn danger small" onclick="deleteMembership(${m.id})">Удалить</button></div>
      </div>
    </div>`).join('');

  return `
    <div class="card">
      <h2>Новый абонемент</h2>
      <div class="row">
        <div style="flex:2 1 200px"><label for="mname">Название</label><input id="mname" placeholder="Например, Месяц, 3 раза в неделю"></div>
        <div><label for="mprice">Цена, ₸</label><input id="mprice" type="number" inputmode="numeric" min="0"></div>
        <div><label for="mvisits">Раз в неделю</label><input id="mvisits" type="number" inputmode="numeric" min="1" max="7" placeholder="Любое"></div>
      </div>
      <div style="margin-top:10px"><label for="mdesc">Описание (необязательно)</label><textarea id="mdesc" rows="2"></textarea></div>
      <div style="margin-top:12px"><button class="btn" onclick="addMembership()">Добавить абонемент</button></div>
    </div>
    ${list || '<p class="muted">Абонементов пока нет. Добавьте первый.</p>'}`;
}

function renderAdmin() {
  app.innerHTML = `
    <div class="top">
      <h1>Админка клуба</h1>
      <button class="btn ghost small" onclick="logout()">Выйти</button>
    </div>
    <div class="tabs">
      <button class="tab ${state.tab === 'trainers' ? 'on' : ''}" onclick="setTab('trainers')">Тренеры</button>
      <button class="tab ${state.tab === 'memberships' ? 'on' : ''}" onclick="setTab('memberships')">Абонементы</button>
    </div>
    <div class="msg ${state.err ? 'err' : ''}" role="status">${esc(state.msg)}</div>
    ${state.tab === 'trainers' ? renderTrainers() : renderMemberships()}`;
}

function render() {
  if (!state.session) renderLogin(); else renderAdmin();
}

init();
</script>
</body>
</html>
