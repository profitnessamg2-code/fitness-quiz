<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подбор тренера и абонемента</title>
<style>
  :root {
    --bg: #f3f5f2;
    --card: #ffffff;
    --ink: #1c2420;
    --muted: #66726b;
    --line: #dfe5e0;
    --accent: #1f6b4f;
    --accent-ink: #ffffff;
    --soft: #e3f0e9;
    --danger: #b3382c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a17;
      --card: #1d2420;
      --ink: #e8eee9;
      --muted: #94a39a;
      --line: #2c3731;
      --accent: #4fb98a;
      --accent-ink: #0d1a13;
      --soft: #1f3329;
      --danger: #e5766a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 6px; }
  h2 { font-size: 19px; margin: 26px 0 4px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .q { margin-bottom: 20px; }
  .q > label, .q > .ql { display: block; font-weight: 600; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-width: 52px; padding: 10px 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 10px; font: inherit; cursor: pointer; text-align: center;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2 label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 11px 12px; font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
  }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn {
    display: block; width: 100%; padding: 13px 16px; border: 0; border-radius: 10px; background: var(--accent);
    color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  .btn.inline { display: inline-block; width: auto; padding: 9px 16px; }
  .who { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .avatar {
    width: 60px; height: 60px; border-radius: 50%; object-fit: cover; flex: 0 0 60px;
    background: var(--bg); border: 1px solid var(--line);
  }
  .avatar.ph { display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: var(--muted); }
  .name { font-size: 18px; font-weight: 700; }
  .who a { color: var(--accent); text-decoration: none; font-size: 14px; }
  .price { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ok { color: var(--accent); font-size: 14px; margin: 0 0 10px; }
  .warn { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .back { background: none; border: 0; color: var(--accent); font: inherit; padding: 0; margin-bottom: 14px; cursor: pointer; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 8px 0; }
  .summary { background: var(--soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: 15px; }
  .contact > * + * { margin-top: 10px; }
  .done { text-align: center; padding-top: 12vh; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Загрузка…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://yixwxsyxrtqrqkzxvskf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hbNcTliHSoJEb1nwWlSU1w_WTT2G1lf';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const DAYS_SHORT = ['пн','вт','ср','чт','пт','сб','вс'];

const S = {
  step: 'form',          // form | results | done
  trainers: [], memberships: [],
  days: [], from: '09:00', to: '12:00', visits: '', needTrainer: true,
  selTrainer: null, selMembership: null,
  name: '', phone: '', err: ''
};
const app = document.getElementById('app');

function esc(x) {
  return String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const hhmm = t => String(t).slice(0, 5);
const mins = t => { const [h, m] = hhmm(t).split(':').map(Number); return h * 60 + m; };
const money = n => Number(n).toLocaleString('ru-RU') + ' ₸';
const dayList = arr => arr.map(d => DAYS_SHORT[d]).join(', ');

/* ---------- подбор ---------- */
function coveredMinutes(slots, f, t) {
  const iv = slots
    .map(s => [Math.max(mins(s.time_from), f), Math.min(mins(s.time_to), t)])
    .filter(x => x[1] > x[0])
    .sort((a, b) => a[0] - b[0]);
  let total = 0, cs = null, ce = null;
  for (const [s, e] of iv) {
    if (ce === null || s > ce) { if (ce !== null) total += ce - cs; cs = s; ce = e; }
    else ce = Math.max(ce, e);
  }
  if (ce !== null) total += ce - cs;
  return total;
}

function matchTrainer(tr, days, f, t) {
  const len = t - f;
  let cov = 0; const full = [], other = [];
  for (const d of days) {
    const slots = (tr.trainer_slots || []).filter(s => s.day === d);
    const c = coveredMinutes(slots, f, t);
    cov += c;
    if (c >= len) full.push(d);
    else other.push({ d, slots: [...slots].sort((a, b) => a.time_from.localeCompare(b.time_from)) });
  }
  return { tr, score: cov / (len * days.length), full, other, perfect: full.length === days.length };
}

function matchMembership(m, f, t, vpw) {
  const hasTime = m.time_from && m.time_to;
  const mf = hasTime ? mins(m.time_from) : 0;
  const mt = hasTime ? mins(m.time_to) : 1440;
  const timeFull = f >= mf && t <= mt;
  const timeOverlap = Math.min(t, mt) - Math.max(f, mf) > 0;
  const visitsOk = !vpw || !m.visits_per_week || m.visits_per_week >= vpw;
  const reasons = [];
  if (!timeFull) reasons.push(`действует с ${hhmm(m.time_from)} до ${hhmm(m.time_to)}, а вы выбрали ${S.from}–${S.to}`);
  if (!visitsOk) reasons.push(`всего ${m.visits_per_week} раз(а) в неделю, а вы хотите ${vpw}`);
  return { m, perfect: timeFull && visitsOk, close: timeOverlap, reasons };
}

/* ---------- данные ---------- */
async function init() {
  const t = await sb.from('trainers').select('*, trainer_slots(*)').eq('active', true).order('name');
  const m = await sb.from('memberships').select('*').eq('active', true).order('price');
  if (t.error || m.error) {
    app.innerHTML = '<p class="err">Не удалось загрузить данные. Обновите страницу.</p>';
    return;
  }
  S.trainers = t.data; S.memberships = m.data;
  render();
}

/* ---------- действия ---------- */
function toggleDay(d) {
  S.days = S.days.includes(d) ? S.days.filter(x => x !== d) : [...S.days, d].sort((a, b) => a - b);
  S.err = ''; render();
}
function setNeed(v) { S.needTrainer = v; render(); }

function showResults() {
  S.from = document.getElementById('from').value;
  S.to = document.getElementById('to').value;
  S.visits = document.getElementById('visits').value;
  if (!S.days.length) { S.err = 'Выберите хотя бы один день'; render(); return; }
  if (!S.from || !S.to || S.from >= S.to) { S.err = 'Укажите время: «с» должно быть раньше «до»'; render(); return; }
  S.err = ''; S.selTrainer = null; S.selMembership = null; S.step = 'results';
  render(); window.scrollTo(0, 0);
}
function backToForm() { S.step = 'form'; S.err = ''; render(); }
function pickTrainer(id) { S.selTrainer = S.selTrainer === id ? null : id; render(); }
function pickMembership(id) { S.selMembership = S.selMembership === id ? null : id; render(); }

async function send() {
  const digits = S.phone.replace(/\D/g, '');
  if (!S.name.trim()) { S.err = 'Введите имя'; render(); return; }
  if (digits.length < 10) { S.err = 'Введите номер телефона'; render(); return; }
  const tr = S.trainers.find(x => x.id === S.selTrainer);
  const mb = S.memberships.find(x => x.id === S.selMembership);
  const row = {
    client_name: S.name.trim(),
    phone: S.phone.trim(),
    trainer_id: tr ? tr.id : null,
    membership_id: mb ? mb.id : null,
    answers: {
      days: S.days.map(d => DAYS[d]),
      from: S.from, to: S.to,
      visits_per_week: S.visits || null,
      need_trainer: S.needTrainer,
      trainer: tr ? tr.name : null,
      membership: mb ? mb.name : null,
      membership_price: mb ? mb.price : null
    }
  };
  const { error } = await sb.from('requests').insert(row);
  if (error) { S.err = 'Не удалось отправить заявку. Попробуйте ещё раз.'; render(); return; }
  S.step = 'done'; render(); window.scrollTo(0, 0);
}
function restart() {
  Object.assign(S, { step: 'form', days: [], visits: '', needTrainer: true, selTrainer: null, selMembership: null, name: '', phone: '', err: '' });
  render();
}

/* ---------- экраны ---------- */
function renderForm() {
  const chips = DAYS_SHORT.map((d, i) =>
    `<button class="chip" aria-pressed="${S.days.includes(i)}" onclick="toggleDay(${i})">${d}</button>`).join('');
  const visitOpts = ['<option value="">Пока не знаю</option>']
    .concat([1, 2, 3, 4, 5, 6, 7].map(n => `<option value="${n}" ${String(S.visits) === String(n) ? 'selected' : ''}>${n}</option>`)).join('');
  return `
    <h1>Подберём тренера и абонемент</h1>
    <p class="lead">Ответьте на четыре вопроса, это займёт минуту.</p>

    <div class="q">
      <span class="ql">В какие дни вам удобно?</span>
      <div class="chips">${chips}</div>
    </div>

    <div class="q">
      <span class="ql">В какое время?</span>
      <div class="grid2">
        <div><label for="from">С</label><input id="from" type="time" value="${esc(S.from)}"></div>
        <div><label for="to">До</label><input id="to" type="time" value="${esc(S.to)}"></div>
      </div>
    </div>

    <div class="q">
      <label for="visits">Сколько раз в неделю хотите ходить?</label>
      <select id="visits">${visitOpts}</select>
    </div>

    <div class="q">
      <span class="ql">Нужен персональный тренер?</span>
      <div class="chips">
        <button class="chip" aria-pressed="${S.needTrainer}" onclick="setNeed(true)">Да</button>
        <button class="chip" aria-pressed="${!S.needTrainer}" onclick="setNeed(false)">Нет, только абонемент</button>
      </div>
    </div>

    <div class="err" role="alert">${esc(S.err)}</div>
    <button class="btn" onclick="showResults()">Показать варианты</button>`;
}

function trainerCard(r, perfect) {
  const t = r.tr, sel = S.selTrainer === t.id;
  const note = perfect
    ? `<p class="ok">Работает во все выбранные дни в это время</p>`
    : `<p class="warn">Подходит: ${r.full.length ? dayList(r.full) : 'нет полных совпадений'}.<br>
        Не совпадает: ${r.other.map(o => DAYS_SHORT[o.d] + ' (' + (o.slots.length ? o.slots.map(s => hhmm(s.time_from) + '–' + hhmm(s.time_to)).join(', ') : 'не работает') + ')').join('; ')}</p>`;
  return `
    <div class="card ${sel ? 'sel' : ''}">
      <div class="who">
        ${t.photo_url ? `<img class="avatar" src="${esc(t.photo_url)}" alt="">` : `<div class="avatar ph">${esc(t.name.slice(0, 1).toUpperCase())}</div>`}
        <div>
          <div class="name">${esc(t.name)}</div>
          ${t.instagram ? `<a href="https://instagram.com/${esc(t.instagram)}" target="_blank" rel="noopener">@${esc(t.instagram)}</a>` : ''}
        </div>
      </div>
      ${note}
      <button class="btn ${sel ? '' : 'ghost'}" onclick="pickTrainer(${t.id})">${sel ? 'Выбран' : 'Выбрать тренера'}</button>
    </div>`;
}

function membershipCard(r, perfect) {
  const m = r.m, sel = S.selMembership === m.id;
  const when = m.time_from && m.time_to ? `с ${hhmm(m.time_from)} до ${hhmm(m.time_to)}` : 'в любое время';
  const visits = m.visits_per_week ? `${m.visits_per_week} раз(а) в неделю` : 'без ограничения по посещениям';
  return `
    <div class="card ${sel ? 'sel' : ''}">
      <div class="row"><div class="name">${esc(m.name)}</div><div class="price">${money(m.price)}</div></div>
      <p class="muted" style="margin:4px 0 8px">${when} · ${visits}</p>
      ${m.description ? `<p style="margin:0 0 8px">${esc(m.description)}</p>` : ''}
      ${perfect ? `<p class="ok">Подходит под ваши ответы</p>` : `<p class="warn">Почему не идеально: ${esc(r.reasons.join('; '))}</p>`}
      <button class="btn ${sel ? '' : 'ghost'}" onclick="pickMembership(${m.id})">${sel ? 'Выбран' : 'Выбрать абонемент'}</button>
    </div>`;
}

function renderResults() {
  const f = mins(S.from), t = mins(S.to), vpw = S.visits ? Number(S.visits) : 0;

  const tm = S.needTrainer ? S.trainers.map(tr => matchTrainer(tr, S.days, f, t)).filter(r => r.score > 0)
    .sort((a, b) => b.score - a.score) : [];
  const tPerfect = tm.filter(r => r.perfect), tClose = tm.filter(r => !r.perfect);

  const mm = S.memberships.map(m => matchMembership(m, f, t, vpw));
  const mPerfect = mm.filter(r => r.perfect).sort((a, b) => a.m.price - b.m.price);
  const mClose = mm.filter(r => !r.perfect && r.close).sort((a, b) => a.m.price - b.m.price);

  let html = `
    <button class="back" onclick="backToForm()">← Изменить ответы</button>
    <h1>Ваши варианты</h1>
    <div class="summary">${dayList(S.days)}, ${esc(S.from)}–${esc(S.to)}${S.visits ? ', ' + S.visits + ' раз(а) в неделю' : ''}</div>`;

  if (S.needTrainer) {
    html += `<h2>Тренеры</h2>`;
    if (tPerfect.length) html += tPerfect.map(r => trainerCard(r, true)).join('');
    else html += `<p class="muted">Тренера, который работает во все выбранные дни в это время, не нашлось.${tClose.length ? ' Ниже самые близкие варианты.' : ''}</p>`;
    if (tPerfect.length && tClose.length) html += `<p class="muted" style="margin-top:16px">Менее подходят, но близки по времени:</p>`;
    html += tClose.map(r => trainerCard(r, false)).join('');
    if (!tm.length) html += `<p class="muted">Подходящих тренеров нет. Оставьте заявку, администратор подберёт вариант вручную.</p>`;
  }

  html += `<h2>Абонементы</h2>`;
  if (mPerfect.length) html += mPerfect.map(r => membershipCard(r, true)).join('');
  else html += `<p class="muted">Идеально подходящего абонемента не нашлось.${mClose.length ? ' Ниже самые близкие варианты.' : ''}</p>`;
  if (mPerfect.length && mClose.length) html += `<p class="muted" style="margin-top:16px">Менее подходят, но близки:</p>`;
  html += mClose.map(r => membershipCard(r, false)).join('');
  if (!mPerfect.length && !mClose.length) html += `<p class="muted">Подходящих абонементов нет. Оставьте заявку, администратор подберёт вариант вручную.</p>`;

  html += `
    <h2>Оставить заявку</h2>
    <p class="muted" style="margin:0 0 10px">Выберите тренера и абонемент выше (можно пропустить) и оставьте контакты. Мы свяжемся с вами.</p>
    <div class="card contact">
      <input placeholder="Ваше имя" autocomplete="name" value="${esc(S.name)}" oninput="S.name=this.value">
      <input placeholder="Телефон" type="tel" autocomplete="tel" value="${esc(S.phone)}" oninput="S.phone=this.value">
      <div class="err" role="alert">${esc(S.err)}</div>
      <button class="btn" onclick="send()">Отправить заявку</button>
    </div>`;
  return html;
}

function renderDone() {
  return `
    <div class="done">
      <h1>Заявка отправлена</h1>
      <p class="lead">Мы свяжемся с вами в ближайшее время.</p>
      <button class="btn ghost inline" onclick="restart()">Пройти заново</button>
    </div>`;
}

function render() {
  app.innerHTML = S.step === 'form' ? renderForm() : S.step === 'results' ? renderResults() : renderDone();
}

init();
</script>
</body>
</html>
